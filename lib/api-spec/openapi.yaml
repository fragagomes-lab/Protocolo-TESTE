openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Protocolo Cirúrgico Ortognático — Clínica da Face
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: protocols
    description: Surgical protocols
  - name: templates
    description: Surgery templates
  - name: phrases
    description: Clinical phrase library
  - name: planning
    description: Virtual 3D planning images
  - name: storage
    description: Object storage upload and serving endpoints

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /protocols:
    get:
      operationId: listProtocols
      tags: [protocols]
      summary: List all protocols
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: surgeryType
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of protocols
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProtocolSummary"
    post:
      operationId: createProtocol
      tags: [protocols]
      summary: Create a new protocol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtocolInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Protocol"

  /protocols/stats:
    get:
      operationId: getProtocolStats
      tags: [protocols]
      summary: Dashboard statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolStats"

  /protocols/recent:
    get:
      operationId: getRecentProtocols
      tags: [protocols]
